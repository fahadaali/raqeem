# ════════════════════════════════════════════════════════════════════════
#  منصة رقيم — إعداد النشر على Cloudflare
#  كل المزوّدات على كلاود فلير:
#    • الاستضافة والتشغيل : Cloudflare Workers + Static Assets
#    • قاعدة البيانات      : Cloudflare D1
#    • تخزين الملفات       : Cloudflare R2
#    • البثّ اللحظي        : Durable Objects
#    • الوظائف المجدولة    : Cron Triggers
#    • المعالجة الخلفية    : Cloudflare Queues (اختياري — خطة مدفوعة)
#  راجع docs/CLOUDFLARE.md لخطوات النشر بالتفصيل.
# ════════════════════════════════════════════════════════════════════════

name = "raqeem"
main = "server/worker/index.js"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# ─── واجهة المستخدم (ملفات ثابتة تُقدَّم من حافة الشبكة) ───
[assets]
directory = "./web"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/ws", "/__bootstrap"]

# ─── قاعدة البيانات D1 ───
# أنشئها بـ:  npx wrangler d1 create raqeem-db     ثم ضع المعرّف هنا
[[d1_databases]]
binding = "DB"
database_name = "raqeem-db"
database_id = "94db7e8a-8014-472e-b115-426c53f4d811"   # ← استبدله بمعرّف قاعدتك بعد إنشائها
migrations_dir = "migrations"

# ─── تخزين الملفات R2 (الفواتير والمرفقات — البند ٦) ───
# أنشئه بـ:  npx wrangler r2 bucket create raqeem-files
[[r2_buckets]]
binding = "FILES"
bucket_name = "raqeem-files"

# ─── البثّ اللحظي: كائن دائم واحد لكل جهة تعليمية (البند ٨) ───
[[durable_objects.bindings]]
name = "HUB"
class_name = "RealtimeHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RealtimeHub"]

# ─── الوظائف الدورية (البنود ٧ و٨ و١٢) ───
[triggers]
# الخطة المجانية تسمح بخمسة مُشغِّلات للحساب كلِّه، لا للعامل وحده. فجُمعت
# الوظائف كلُّها في نبضةٍ واحدةٍ كلَّ خمس دقائق، والعامل يوزّعها من وقت الحدث:
# الطابور كلَّ نبضة · التذاكر كلَّ ربع ساعة · المؤشرات رأسَ كلِّ ساعة ·
# اليوميات الأربع عند ٠٠ و٠١ و٠٢ و٠٣ بتوقيت UTC (٣–٦ صباحاً بالرياض).
crons = ["*/5 * * * *"]

# ─── تحميل ملف المخطط كنص داخل الحزمة ───
[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

# ─── الإعدادات غير السرّية ───
[vars]
NODE_ENV = "production"
APP_URL = "https://raqeem.fahad2ao.workers.dev"
VAPID_SUBJECT = "mailto:admin@riyadh-qu.sa"
GEOFENCE_DEFAULT_RADIUS = "50"
UPLOAD_MAX_MB = "15"
RATE_LIMIT_MAX = "300"
PUBLIC_API_RATE_LIMIT_MAX = "120"
LOGIN_IP_MAX = "120"
LOGIN_ACCOUNT_MAX = "8"
BACKUP_ENABLED = "true"         # نسخة SQL يومية إلى R2 (إضافةً إلى Time Travel المدمج في D1)
BACKUP_KEEP = "14"

# ─── الأسرار (لا تُكتب هنا) ───
#   npx wrangler secret put JWT_SECRET
#   npx wrangler secret put VAPID_PUBLIC_KEY
#   npx wrangler secret put VAPID_PRIVATE_KEY
#   npx wrangler secret put BOOTSTRAP_TOKEN
#   npx wrangler secret put GOOGLE_MAPS_API_KEY   # مفتاح Map Tiles API — بدونه تعمل الخريطة على الطبقة المفتوحة

# ─── الطابور (اختياري — يتطلّب خطة Workers Paid) ───
# لتفعيله: أزل التعليق، ثم:  npx wrangler queues create raqeem-jobs
# [[queues.producers]]
# binding = "JOBS"
# queue = "raqeem-jobs"
#
# [[queues.consumers]]
# queue = "raqeem-jobs"
# max_batch_size = 10
# max_batch_timeout = 5
# max_retries = 3

[observability]
enabled = true

# ─── بيئة التجربة ───
[env.staging]
name = "raqeem-erp-staging"
vars = { NODE_ENV = "staging", VAPID_SUBJECT = "mailto:admin@riyadh-qu.sa" }

# `triggers` مفتاحٌ موروث في wrangler: بيئة التجربة كانت تأخذ مُشغِّلات الإنتاج
# نفسها، فتستهلك نصيباً من حدّ الحساب (خمسة على الخطة المجانية) وتزاحم الإنتاج
# عليه. وبيئةُ تجربةٍ لا تحتاج وظائف دورية أصلاً — لا نسخَ احتياطي ولا فوترة.
[env.staging.triggers]
crons = []
