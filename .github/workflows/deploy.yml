# ════════════════════════════════════════════════════════════════════════
#  نشر منصة رقيم على Cloudflare Workers
#
#  يعمل عند كل دفع إلى main، ويمكن تشغيله يدوياً من تبويب Actions.
#  الشرط الوحيد: سرّ CLOUDFLARE_API_TOKEN في إعدادات المستودع.
#
#  لا يطبّق ترحيلات D1 تلقائياً عن قصد: تغيير المخطط على قاعدة فيها بيانات
#  قرارٌ يُتّخذ بعينين مفتوحتين لا أثراً جانبياً لدفعة شيفرة. طبّقه من كونسول
#  D1 أو بـ `npm run cf:migrate` ثم ادفع.
# ════════════════════════════════════════════════════════════════════════
name: نشر على Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# دفعتان متتاليتان لا تتسابقان على النشر
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: بناء ونشر
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # wrangler 4 يشترط Node 22 فأحدث — والتطوير يجري عليها أصلاً
          node-version: '22'
          cache: npm

      - name: تثبيت الاعتماديات
        run: npm ci

      - name: فحص التوصيل (خادم + واجهة لكل قدرة)
        run: npm run verify:wiring

      - name: بناء ملفات النشر (الترحيلات ورؤوس الأمان)
        run: npm run cf:build

      # بيئة التجربة تُخلي نصيبها من حدّ الكرون قبل أن يطلب الإنتاجُ نصيبه.
      # `crons = []` في الملفّ لا أثر له حتى يُنشَر، والنشرُ هنا للإنتاج وحده،
      # فتبقى مُشغِّلات تجربةٍ قديمةٍ محجوزةً على الحساب تزاحم الإنتاج عليها.
      # وإن لم تكن بيئة التجربة منشورةً أصلاً فلا شيء يُخلى، والخطوة تمضي.
      - name: إخلاء مُشغِّلات بيئة التجربة
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler triggers deploy --env staging

      # البيئة تُسمّى صراحةً: الملفّ يعرّف `env.staging` إلى جانب البيئة العليا،
      # و`deploy` بلا `--env` يترك الاختيار لسلوكٍ افتراضي حذّر منه wrangler نفسه
      # في كل تشغيل. والسلسلة الفارغة تعني البيئة العليا — وهي التي يفحصها
      # `/api/health` أدناه على raqeem.fahad2ao.workers.dev.
      - name: نشر العامل
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --env=""

      - name: التحقّق من صحة الخدمة بعد النشر
        run: |
          for i in $(seq 1 10); do
            body=$(curl -fsS --max-time 20 https://raqeem.fahad2ao.workers.dev/api/health) && {
              echo "$body"
              echo "$body" | grep -q '"status":"ok"' && exit 0
            }
            echo "محاولة $i — لم تستقر الخدمة بعد، إعادة المحاولة…"
            sleep 6
          done
          echo "::error::الخدمة لم ترجع status=ok بعد النشر"
          exit 1
